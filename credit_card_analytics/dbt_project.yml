name: credit_card_analytics

profile: credit_card_analytics

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # YYYY-MM of the statement to (re)process. Empty means last month; see macros/statement_month.sql
  statement_month: ""

models:
  credit_card_analytics:
    +static_analysis: strict
    # Materialize staging/intermediate models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
      +schema: marts
